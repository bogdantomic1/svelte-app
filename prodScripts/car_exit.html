<script src="https://cxppusa1formui01cdnsa01-endpoint.azureedge.net/eur/FormCapture/FormCapture.bundle.js"></script>
<script>
  $(document).ready(function () {
    function submitForm(form, mappings) {
      const serializedForm = d365mktformcapture.serializeForm(form, mappings)
      const payload = serializedForm.SerializedForm.build()
      const formedUrl =
        'https://public-eur.mkt.dynamics.com/api/v1.0/orgs/40ee6f68-a215-4acd-9b7d-a6e91e59d457/landingpageforms/forms/cf8042db-b34d-f011-877a-6045bdf4e2d3'
      if (
        $('#Email').val()?.trim() &&
        $('#FirstName').val()?.trim() &&
        $('#LastName').val()?.trim()
      ) {
        fetch(formedUrl, {
          method: 'post',
          headers: {
            'Content-Type': 'application/json;charset=UTF-8',
          },
          body: payload.data,
          keepalive: true,
        })
          .then(() => {
            console.log('submission complete')
          })
          .catch((e) => {
            console.log(e)
          })
      } else {
        return
      }
    }
    d365mktformcapture.waitForElement('#fakeFormCarComplete').then((form) => {
      const mappings = [
        { FormFieldName: 'Email', DataverseFieldName: 'emailaddress1' },
        { FormFieldName: 'FirstName', DataverseFieldName: 'firstname' },
        { FormFieldName: 'LastName', DataverseFieldName: 'lastname' },
      ]

      submitForm(form, mappings)
    })
  })
</script>
